.search-icon { width: 14px; height: 14px; position: relative; flex: 0 0 auto; border: 1.8px solid var(--ink-faint); border-radius: 50%; }.search-icon::after { content: ""; position: absolute; width: 6px; height: 1.8px; right: -5px; bottom: -2px; transform: rotate(45deg); background: var(--ink-faint); }

.header-actions { display: flex; align-items: center; gap: 17px; white-space: nowrap; }.header-actions a, .version-button { border: 0; background: none; color: var(--ink-soft); font-size: .75rem; font-weight: 600; cursor: pointer; }.version-button { padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }

.sidebar-help { margin: 30px 9px 0; padding: 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }.sidebar-help strong { font-size: .8rem; }.sidebar-help p { margin: 4px 0 8px; color: var(--ink-faint); font-size: .75rem; line-height: 1.45; }.sidebar-help a { color: var(--purple-deep); font-size: .75rem; font-weight: 650; }.sidebar-backdrop { display: none; }

.article { min-width: 0; padding: 32px 0 80px; }.breadcrumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 43px; color: var(--ink-faint); font-size: .72rem; }.breadcrumbs a:hover { color: var(--purple-deep); }.breadcrumbs b { color: var(--ink-soft); font-weight: 600; }
.article-heading { padding-bottom: 34px; border-bottom: 1px solid var(--line); }.page-type { color: var(--purple-deep); font-family: "IBM Plex Mono", monospace; font-size: .61rem; letter-spacing: .14em; font-weight: 600; }.article-heading h1 { max-width: 700px; margin: 12px 0 17px; font-size: clamp(2.25rem, 4vw, 3.4rem); line-height: 1.06; letter-spacing: -.045em; }.article-heading > p { max-width: 680px; margin: 0; color: var(--ink-soft); font-size: 1.06rem; line-height: 1.65; }.page-meta { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 24px; color: var(--ink-faint); font-size: .68rem; }.page-meta span { padding-right: 20px; border-right: 1px solid var(--line); }.page-meta span:last-child { border: 0; }.page-meta b { color: var(--ink-soft); }
.guide-scope { display: flex; gap: 13px; margin: 28px 0 12px; padding: 16px 18px; border: 1px solid color-mix(in oklch, var(--cyan) 30%, var(--line)); border-left: 3px solid var(--cyan); border-radius: 8px; background: var(--cyan-wash); }.scope-icon { width: 22px; height: 22px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; background: var(--cyan); color: #fff; font-family: "IBM Plex Mono", monospace; font-size: .65rem; }.guide-scope strong { font-size: .8rem; }.guide-scope p { margin: 2px 0 0; color: var(--ink-soft); font-size: .76rem; line-height: 1.5; }
.content-section { display: grid; grid-template-columns: 38px 1fr; gap: 18px; padding: 48px 0; border-bottom: 1px solid var(--line); }.section-number { width: 31px; height: 31px; display: grid; place-items: center; margin-top: 2px; border-radius: 8px; background: var(--purple-wash); color: var(--purple-deep); font-family: "IBM Plex Mono", monospace; font-size: .7rem; font-weight: 600; }.help-number { color: var(--cyan); background: var(--cyan-wash); }.section-body { min-width: 0; }.section-body h2 { margin: 0 0 10px; font-size: 1.55rem; line-height: 1.2; letter-spacing: -.025em; }.section-body > p { margin-bottom: 22px; color: var(--ink-soft); font-size: .9rem; }
.requirements { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }.requirements > div { display: grid; grid-template-columns: 25px 1fr auto; gap: 11px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }.requirements > div:last-child { border: 0; }.check, .optional { width: 23px; height: 23px; display: grid; place-items: center; border-radius: 6px; color: oklch(0.46 0.1 155); background: oklch(0.94 0.04 155); font-size: .68rem; }.optional { color: var(--ink-faint); background: var(--bg); }.requirements p { display: flex; flex-direction: column; margin: 0; line-height: 1.35; }.requirements strong { font-size: .78rem; }.requirements small { color: var(--ink-faint); font-size: .68rem; }.requirements a { color: var(--purple-deep); font-size: .66rem; font-weight: 600; }.requirements b { padding: 3px 6px; border-radius: 4px; color: var(--ink-faint); background: var(--bg); font-family: "IBM Plex Mono", monospace; font-size: .48rem; }

.expected { display: flex; gap: 12px; margin-top: 18px; padding: 14px 16px; border: 1px solid oklch(0.87 0.05 155); border-radius: 8px; background: oklch(0.97 0.02 155); }.expected > span { width: 22px; height: 22px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; color: #fff; background: var(--green); font-size: .65rem; }.expected div { display: flex; flex-direction: column; gap: 4px; }.expected strong { font-size: .78rem; }.expected code { width: max-content; padding: 3px 6px; border-radius: 4px; color: oklch(0.4 0.09 155); background: oklch(0.92 0.04 155); font-family: "IBM Plex Mono", monospace; font-size: .64rem; }.expected p { margin: 0; color: var(--ink-soft); font-size: .68rem; }

.result-preview { margin-top: 20px; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; }.preview-window { padding: 0 16px 16px; background: var(--bg); }.preview-top { height: 35px; display: flex; align-items: center; gap: 5px; color: var(--ink-faint); font-size: .6rem; }.preview-top i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }.preview-top span { margin-left: 7px; }.preview-app { height: 205px; display: grid; grid-template-columns: 100px 1fr; overflow: hidden; border: 1px solid var(--line); border-radius: 7px; background: #fff; box-shadow: 0 5px 18px oklch(0.3 0.02 210 / .07); }.preview-app aside { padding: 24px 14px; background: var(--purple-deep); }.preview-app aside b { display: block; height: 7px; margin-bottom: 13px; border-radius: 4px; background: oklch(1 0 0 / .25); }.preview-app > div { padding: 23px; }.preview-app > div > span { display: block; width: 54px; height: 5px; margin-bottom: 12px; border-radius: 3px; background: var(--cyan); }.preview-app strong { font-size: 1rem; }.preview-app p { margin: 2px 0 14px; color: var(--ink-faint); font-size: .63rem; }.preview-app ul { margin: 0; padding: 0; list-style: none; }.preview-app li { height: 26px; margin-bottom: 6px; border: 1px solid var(--line-soft); border-radius: 5px; background: var(--bg); }.preview-caption { display: flex; gap: 10px; padding: 13px 15px; border-top: 1px solid var(--line); }.preview-caption > span { color: var(--green); }.preview-caption strong { font-size: .76rem; }.preview-caption p { margin: 1px 0 0; color: var(--ink-faint); font-size: .66rem; }
.troubleshooting-list { border-top: 1px solid var(--line); }.troubleshooting-list details { border-bottom: 1px solid var(--line); }.troubleshooting-list summary { display: flex; justify-content: space-between; padding: 13px 3px; cursor: pointer; list-style: none; font-size: .8rem; font-weight: 600; }.troubleshooting-list summary::-webkit-details-marker { display: none; }.troubleshooting-list summary b { color: var(--purple-deep); }.troubleshooting-list details p { margin: 0 0 14px; padding-right: 25px; color: var(--ink-soft); font-size: .74rem; }.troubleshooting-list code { padding: 2px 4px; border-radius: 3px; background: var(--bg); font-family: "IBM Plex Mono", monospace; font-size: .65rem; }
.next-section { padding: 50px 0; }.next-section h2 { margin: 7px 0 20px; font-size: 1.55rem; }.next-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }.next-grid a { display: flex; flex-direction: column; min-height: 170px; padding: 17px; border: 1px solid var(--line); border-radius: 9px; transition: border-color .2s, box-shadow .2s; }.next-grid a:hover { border-color: var(--purple); box-shadow: 0 6px 20px oklch(0.3 0.02 210 / .08); }.next-grid a > span { color: var(--purple-deep); font-family: "IBM Plex Mono", monospace; font-size: .62rem; }.next-grid strong { margin-top: 17px; font-size: .9rem; }.next-grid p { color: var(--ink-soft); font-size: .72rem; }.next-grid b { margin-top: auto; color: var(--purple-deep); font-size: .66rem; }

:where(a, button, input, summary, [role="tab"]):focus-visible { outline: 3px solid color-mix(in oklch, var(--purple) 72%, white); outline-offset: 3px; }
.brand-name small, .docs-label { font-size: .75rem; }
.header-search:focus-within { border-color: var(--purple); box-shadow: 0 0 0 3px var(--purple-wash); }
.header-search input { font-size: .875rem; }
.header-search kbd, .search-popover-head, .search-popover-head button { font-size: .7rem; }
.search-popover a, .search-result { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; padding: 9px; border-radius: 8px; }
.search-result > span:nth-child(2) { display: flex; flex-direction: column; line-height: 1.3; }
.search-result.planned { opacity: .64; }
.search-popover strong { font-size: .82rem; }.search-popover small { font-size: .75rem; }.search-popover b { font-size: .68rem; }.result-icon { font-size: .75rem; }
.header-actions a, .version-button { font-size: .8rem; }

.version-popover span { color: var(--ink-faint); }.version-popover a { margin-top: 5px; color: var(--purple-deep); }
.nav-planned { display: flex; justify-content: space-between; align-items: center; min-height: 36px; padding: 6px 10px; color: var(--ink-faint); font-size: .82rem; }
.nav-planned b { font-family: "IBM Plex Mono", monospace; font-size: .65rem; font-weight: 500; text-transform: uppercase; }
.breadcrumbs { font-size: .78rem; }.mobile-toc { display: none; }
.page-type, .step-progress { font-size: .75rem; }.step-progress { display: block; margin-bottom: 6px; color: var(--ink-faint); font-family: "IBM Plex Mono", monospace; font-size: .7rem; letter-spacing: .14em; font-weight: 600; }
.page-meta { font-size: .75rem; }.scope-icon { font-size: .75rem; }.guide-scope p { font-size: .82rem; }
.requirements strong { font-size: .82rem; }.requirements small { font-size: .75rem; }.requirements b { font-size: .68rem; }
.verify-command { padding: 5px 7px; border-radius: 5px; background: var(--bg); color: var(--ink-soft); font-family: "IBM Plex Mono", monospace; font-size: .72rem; }.prereq-number { color: var(--green); background: oklch(0.95 0.035 155); }
.code-top { font-size: .7rem; }.code-top button { font-size: .72rem; }.code-block code { font-size: .78rem; }
.expected strong { font-size: .82rem; }.expected code { font-size: .72rem; }.expected p { font-size: .75rem; }.target-tabs button { font-size: .78rem; }
.preview-caption strong { font-size: .8rem; }.preview-caption p, .preview-app p { font-size: .75rem; }.troubleshooting-list details p { font-size: .8rem; }.troubleshooting-list code { font-size: .75rem; }
.next-grid a, .next-planned { display: flex; flex-direction: column; min-height: 170px; padding: 17px; border: 1px solid var(--line); border-radius: 9px; }
.next-grid a > span, .next-planned > span { color: var(--purple-deep); font-family: "IBM Plex Mono", monospace; font-size: .72rem; }.next-grid p { font-size: .78rem; }.next-grid b { font-size: .72rem; }.next-planned { opacity: .66; }.next-planned b { margin-top: auto; color: var(--ink-faint); }
.article-feedback { font-size: .78rem; }
.toc > a:first-of-type { color: var(--ink-faint); font-weight: 400; }.toc > a.active, .toc > a:hover { color: var(--purple-deep); }.toc > a.active { font-weight: 650; }.toc > span { font-size: .7rem; }

@media (max-width: 1280px) {
