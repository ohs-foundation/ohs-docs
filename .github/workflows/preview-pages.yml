name: Preview

# Preview-branch only. Publishes the documentation site to this fork's Pages
# so it can be reviewed before the upstream pull request is merged.
# Not intended for ohs-foundation/ohs-docs.
#
# DOCS_URL overrides the canonical URL so the preview's canonical tags and
# sitemap point at the fork rather than at production.

on:
  push:
    branches: [docs/poc-preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOCS_URL: https://nawitech.github.io

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run validate
      - run: npm run check:build
      - run: npm run smoke:paths
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
