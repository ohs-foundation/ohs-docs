name: Docusaurus feasibility PoC

on:
  pull_request:
    paths:
      - 'poc/**'
      - '.github/workflows/poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - run: npm install --global npm@11.16.0
      - run: npm --prefix poc run bootstrap
      - run: npm --prefix poc run validate -- --candidate=docusaurus
      - run: npm --prefix poc run build -- --candidate=docusaurus
      - run: npm --prefix poc run smoke:paths -- --candidate=docusaurus
      - run: npm --prefix poc run a11y -- --candidate=docusaurus
      - run: npm --prefix poc run capture -- --candidate=docusaurus
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docusaurus-feasibility-review
          path: |
            poc/.output/docusaurus
            poc/baseline/capture-manifest.json
            poc/results/accessibility
            poc/results/screenshots
          retention-days: 14
