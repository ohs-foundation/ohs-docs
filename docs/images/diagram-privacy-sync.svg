<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="psTitle psDesc">
  <title id="psTitle">Privacy and sync proxy architecture</title>
  <desc id="psDesc">Mobile devices and third-party SMART-on-FHIR applications both connect through the Info Gateway reverse proxy. An auth provider issues and validates OpenID Connect and OAuth2 tokens for the gateway. The gateway enforces access policy and sync rules before forwarding requests to the standard FHIR server.</desc>

  <style>
    :root, svg {
      --found:      #2D86C4;
      --found-fill: #E3F1FA;
      --store:      #5F6368;
      --store-fill: #F1F3F4;
      --ink:        #1A1A2E;
      --muted:      #6B7280;
      --line:       #9AA0A6;
      --bg:         #FFFFFF;
      --hair:       #DADCE0;
    }
    @media (prefers-color-scheme: dark) {
      :root, svg {
        --found:      #6FB6E8;
        --found-fill: #16293A;
        --store:      #9AA0A6;
        --store-fill: #24262B;
        --ink:        #E8EAED;
        --muted:      #9AA0A6;
        --line:       #6B7280;
        --bg:         #131417;
        --hair:       #3C4043;
      }
    }
    .bg     { fill: var(--bg); }
    .lbl    { font: 600 23px "Hanken Grotesk", "Google Sans", Inter, system-ui, sans-serif; text-anchor: middle; fill: var(--found); }
    .lbl-s  { font: 600 23px "Hanken Grotesk", "Google Sans", Inter, system-ui, sans-serif; text-anchor: middle; fill: var(--ink); }
    .sub    { font: 400 17px "Hanken Grotesk", "Google Sans", Inter, system-ui, sans-serif; text-anchor: middle; fill: var(--muted); }
    .leg    { font: 400 19px "Hanken Grotesk", "Google Sans", Inter, system-ui, sans-serif; fill: var(--ink); }
    .kc-t   { font: 600 20px "Hanken Grotesk", "Google Sans", Inter, system-ui, sans-serif; fill: #FFFFFF; text-anchor: middle; }
    .flow   { fill: none; stroke: var(--line); stroke-width: 2.6; }
    .f-fill { fill: var(--found-fill); stroke: var(--found); stroke-width: 2.4; }
    .s-fill { fill: var(--store-fill); stroke: var(--store); stroke-width: 2.4; }
    .cyl    { fill: var(--store); }
    .cyl-t  { fill: #7E848A; }
    .hair   { stroke: var(--hair); stroke-width: 1.6; }
  </style>

  <defs>
    <marker id="psAh" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0.6 L 10 5 L 0 9.4 z" fill="var(--line)"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="760"/>

  <text class="lbl" x="220" y="64">Mobile devices</text>
  <text class="sub" x="220" y="90">frontline sync clients</text>

  <text class="lbl-s" x="550" y="64">SMART-on-FHIR apps</text>
  <text class="sub" x="550" y="90">third-party clinical applications</text>

  <!-- phone -->
  <g transform="translate(190,110)">
    <rect class="f-fill" x="0" y="0" width="60" height="106" rx="11"/>
    <rect x="16" y="14" width="28" height="6" rx="3" fill="var(--found)" opacity=".45"/>
    <rect x="12" y="30" width="36" height="5" rx="2.5" fill="var(--found)" opacity=".22"/>
    <rect x="12" y="43" width="30" height="5" rx="2.5" fill="var(--found)" opacity=".22"/>
    <circle cx="18" cy="62" r="6" fill="none" stroke="var(--found)" stroke-width="2.2"/>
    <path d="M15 62 l2.4 2.6 l4.4 -5.2" stroke="var(--found)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="30" y="57" width="20" height="5" rx="2.5" fill="var(--found)" opacity=".22"/>
    <circle cx="18" cy="82" r="6" fill="none" stroke="var(--found)" stroke-width="2.2"/>
    <rect x="30" y="77" width="16" height="5" rx="2.5" fill="var(--found)" opacity=".22"/>
  </g>

  <!-- SMART app window -->
  <g transform="translate(500,120)">
    <rect class="s-fill" x="0" y="0" width="100" height="90" rx="10"/>
    <rect x="0" y="0" width="100" height="22" rx="10" fill="var(--store)" opacity=".18"/>
    <circle cx="14" cy="11" r="3" fill="var(--store)"/>
    <circle cx="26" cy="11" r="3" fill="var(--store)" opacity=".6"/>
    <circle cx="38" cy="11" r="3" fill="var(--store)" opacity=".35"/>
    <rect x="38" y="50" width="24" height="20" rx="3" fill="none" stroke="var(--store)" stroke-width="2.2"/>
    <path d="M42 50 v-6 a8 8 0 0 1 16 0 v6" fill="none" stroke="var(--store)" stroke-width="2.2"/>
  </g>

  <text class="lbl" x="700" y="290">Info Gateway</text>
  <text class="sub" x="700" y="314">access policy and sync rules</text>

  <!-- gateway shield -->
  <g transform="translate(655,330)">
    <path d="M45 0 L90 20 V55 C90 80 68 95 45 100 C22 95 0 80 0 55 V20 Z" class="f-fill"/>
    <rect x="27" y="50" width="36" height="28" rx="4" fill="none" stroke="var(--found)" stroke-width="2.4"/>
    <path d="M33 50 v-10 a12 12 0 0 1 24 0 v10" fill="none" stroke="var(--found)" stroke-width="2.4"/>
    <circle cx="45" cy="62" r="4" fill="var(--found)"/>
  </g>

  <!-- auth provider -->
  <g transform="translate(900,340)">
    <rect width="220" height="58" rx="29" fill="var(--store)"/>
    <circle cx="32" cy="29" r="8.5" fill="none" stroke="#FFFFFF" stroke-width="2.6"/>
    <path d="M40 29 h18 m-6 0 v7 m6 -7 v6" stroke="#FFFFFF" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <text class="kc-t" x="140" y="36">Auth provider</text>
  </g>
  <text class="sub" x="1010" y="422">OpenID Connect &#183; OAuth2</text>

  <!-- FHIR server -->
  <text class="lbl-s" x="1238" y="540">FHIR server</text>
  <text class="sub" x="1238" y="676">source of truth</text>
  <g transform="translate(1180,560)">
    <ellipse cx="58" cy="0" rx="58" ry="17" class="cyl-t"/>
    <path d="M 0 0 v 24 a 58 17 0 0 0 116 0 v -24 z" class="cyl"/>
    <ellipse cx="58" cy="40" rx="58" ry="17" class="cyl-t"/>
    <path d="M 0 40 v 24 a 58 17 0 0 0 116 0 v -24 z" class="cyl"/>
    <ellipse cx="58" cy="80" rx="58" ry="17" class="cyl-t"/>
    <path d="M 0 80 v 24 a 58 17 0 0 0 116 0 v -24 z" class="cyl"/>
  </g>

  <!-- flows -->
  <path class="flow" d="M 220 216 C 220 300, 420 320, 655 372" marker-end="url(#psAh)"/>
  <path class="flow" d="M 550 210 C 550 280, 610 320, 655 388" marker-end="url(#psAh)"/>
  <path class="flow" d="M 745 369 L 896 369" marker-end="url(#psAh)" marker-start="url(#psAh)"/>
  <path class="flow" d="M 715 428 C 850 490, 1000 540, 1178 598" marker-end="url(#psAh)"/>

  <!-- legend -->
  <path d="M 260 700 h 880" class="hair"/>
  <circle cx="296" cy="736" r="11" fill="var(--found)"/>
  <text class="leg" x="318" y="743">OHS foundational components</text>
  <circle cx="700" cy="736" r="11" fill="var(--store)"/>
  <text class="leg" x="722" y="743">Third-party or standards-based systems</text>
</svg>
